name: 🟢 Hello Phase

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Sisa loop'
        required: true
        default: '999'

permissions:
  actions: write
  contents: read

concurrency:
  group: phase-hello
  cancel-in-progress: false

jobs:
  run-hello:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Hello world
        run: |
          echo "hello world"
          sleep 20

  trigger-lscpu:
    needs: run-hello
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch phase-lscpu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LC: ${{ github.event.inputs.loop_count }}
        run: |
          set -euo pipefail
          LC="${LC:-999}"
          [[ "$LC" =~ ^[0-9]+$ ]] || { echo "::error::loop_count invalid"; exit 1; }
          [ "$LC" -le 0 ] && { echo "loop selesai"; exit 0; }
          new=$((LC - 1))
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/phase-lscpu.yml/dispatches" \
            -d "{\"ref\":\"${{ github.event.repository.default_branch }}\",\"inputs\":{\"loop_count\":\"$new\"}}"
          echo "✅ dispatch $new"